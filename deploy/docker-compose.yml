# Локальная инфраструктура проекта: Kafka (KRaft, без ZooKeeper),
# PostgreSQL и Kafka UI. Один брокер, replication factor 1 — отказоустойчивость
# в исследовательском стенде не проверяется, а лишние реплики только замедляют старт.

name: mdp

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: mdp-kafka
    ports:
      # Наружу торчит только внешний листенер: приложения запускаются
      # с хоста (go run), а не в контейнере.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # Один узел совмещает роли брокера и контроллера: отдельный
      # контроллерный кворум на трёх инструментах не нужен.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # Два листенера с разными advertised-адресами — иначе клиент с хоста
      # получит в метаданных имя kafka, которое с хоста не резолвится,
      # а контейнеры получат localhost и будут стучаться сами в себя.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Ноль вместо трёх секунд по умолчанию: при старте одиночного
      # консьюмера незачем ждать «вдруг подойдут ещё».
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Топики создаются явно сервисом kafka-init с нужным числом партиций.
      # Автосоздание дало бы одну партицию на первый же produce и молча
      # сломало бы партиционирование по символу.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Идентификатор кластера фиксирован, чтобы том с данными переживал
      # пересоздание контейнера: при пустом значении образ форматирует
      # хранилище новым UUID и отказывается читать старый.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Успешный запрос версий API означает, что брокер не просто запущен,
      # а принял роль лидера и готов обслуживать клиентов.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Одноразовый сервис: создаёт топики и завершается. Держать создание
  # топиков в приложении не хочется — это операция администрирования,
  # а не часть конвейера.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: mdp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        TOPICS=/opt/kafka/bin/kafka-topics.sh
        BOOTSTRAP=kafka:19092

        # 4 партиции при трёх инструментах — число подобрано замером, а не
        # рассуждением. Ключ партиционирования это символ, и напрашивалось
        # взять партиций по числу инструментов. Но Kafka раскладывает ключи
        # по murmur2, и на трёх партициях все три наших символа дают один и
        # тот же остаток: весь поток уходит в одну партицию, две пустуют.
        # На четырёх каждый символ получает свою, четвёртая остаётся пустой.
        # Урок общий: хеш не даёт равномерности на малом числе ключей,
        # поэтому партиций берут с запасом и распределение проверяют.
        #
        # retention 24 часа: поток восстановимо перечитывается с биржи,
        # хранить сделки дольше в учебном стенде незачем.
        "$$TOPICS" --bootstrap-server "$$BOOTSTRAP" --create --if-not-exists \
          --topic md.trades --partitions 4 --replication-factor 1 \
          --config retention.ms=86400000

        # cleanup.policy=compact: ключ свечи — <symbol>|<timeframe>, поэтому
        # компакция оставляет последнюю версию каждой свечи и топик
        # работает как снимок текущего состояния, а не как журнал.
        "$$TOPICS" --bootstrap-server "$$BOOTSTRAP" --create --if-not-exists \
          --topic md.candles --partitions 4 --replication-factor 1 \
          --config cleanup.policy=compact

        echo "--- topics ---"
        "$$TOPICS" --bootstrap-server "$$BOOTSTRAP" --describe --topic md.trades
        "$$TOPICS" --bootstrap-server "$$BOOTSTRAP" --describe --topic md.candles

  postgres:
    image: postgres:16-alpine
    container_name: mdp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: marketdata
      POSTGRES_PASSWORD: marketdata
      POSTGRES_DB: marketdata
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      # -h localhost принудительно проверяет TCP: без него pg_isready ходит
      # через unix-сокет и отвечает «готов» раньше, чем поднят слушатель,
      # в который постучится приложение с хоста.
      test: ["CMD-SHELL", "pg_isready -U marketdata -d marketdata -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mdp-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mdp
      # Внутренний листенер: UI живёт в той же docker-сети.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka-data:
  pg-data:
